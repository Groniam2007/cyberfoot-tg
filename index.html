<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><script src="https://telegram.org/js/telegram-web-app.js"></script><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CyberFoot Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Unbounded:wght@600;800&display=swap"><style>
/* Layout: matchday programme under floodlights — night-navy ground, chalk type, floodlight gold for actions, shield monograms for clubs. One committed dark look. */
:root{
  --bg:#0a1220;--s1:#111b2d;--s2:#18253c;--s3:#22314d;--ln:rgba(160,185,230,.13);
  --fg:#eaf0fa;--mu:#8e9bb4;--gold:#ffc93c;--turf:#35c27c;--red:#f0605a;--blue:#4c8cff;--orange:#ff8a00;
  --fd:'Unbounded','Arial Black',system-ui,sans-serif;--fn:'Oswald','Arial Narrow',Impact,sans-serif;--fb:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cd:var(--s1);--bd:var(--ln);--ac:var(--gold);--on:#1d1500;--hi:rgba(53,194,124,.14);
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--fg);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;
  background:radial-gradient(80% 38% at 50% -6%,rgba(255,214,120,.11),transparent 62%),repeating-linear-gradient(180deg,rgba(53,194,124,.028) 0 72px,transparent 72px 144px),var(--bg);background-color:var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:600px;margin:0 auto;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:800 clamp(38px,11vw,58px)/.95 var(--fd);letter-spacing:-.03em;margin:8px 0 10px;color:var(--fg);text-wrap:balance}
h2{font:600 17px/1.25 var(--fd);letter-spacing:-.01em;margin:18px 0 10px;text-wrap:balance}
h3{font:700 20px/1.2 var(--fd);margin:4px 0 8px}
b{font-weight:600}
.mu{color:var(--mu)}
.g{color:var(--gold)}
.note{font-size:13px;margin:8px 2px}
.c{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.c>b:first-child{display:block;font:600 13px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.c.hero{background:linear-gradient(150deg,rgba(255,201,60,.13),rgba(255,201,60,0) 55%),var(--s1);border-color:rgba(255,201,60,.35)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 14px/1.2 var(--fb);background:var(--gold);color:var(--on);border:0;border-radius:11px;padding:10px 14px;min-height:40px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s}
button:hover{filter:brightness(1.07)}
button:active{transform:scale(.97)}
button:focus-visible,.club:focus-visible,.oc:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.s{background:transparent;color:var(--fg);border:1px solid var(--ln)}
button.s:hover{background:var(--s2);filter:none}
button:disabled{opacity:.35;cursor:default;transform:none}
select{font:inherit}
/* header */
.top{display:grid;gap:10px;padding:6px 0 4px}
.top-id{display:flex;align-items:center;gap:12px;min-width:0}
.top-t{min-width:0}
.top-n{font:700 20px/1.1 var(--fd);letter-spacing:-.01em;overflow-wrap:anywhere}
.top-m{color:var(--mu);font-size:12.5px;margin-top:3px}
.top-k{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt{display:grid;gap:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.mt i{display:block;height:6px;border-radius:4px;background:var(--s3);position:relative;overflow:hidden}
.mt i::after,.prog i::after{content:"";position:absolute;inset:0;width:var(--w);border-radius:4px;background:linear-gradient(90deg,var(--red),var(--gold) 50%,var(--turf))}
.top-s{display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border:1px solid var(--ln);border-radius:14px}
.top-s div{display:grid;justify-items:center;padding:8px 2px;min-width:0}
.top-s div+div{border-left:1px solid var(--ln)}
.top-s b{font:600 18px/1.1 var(--fn);font-variant-numeric:tabular-nums;color:var(--fg)}
.top-s span{font-size:10.5px;color:var(--mu);letter-spacing:.04em;text-transform:uppercase}
.hd{display:none}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:rgba(9,16,29,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
.tabs button{background:none;border:0;color:var(--mu);min-height:52px;padding:6px 0;font-size:10.5px;font-weight:600;display:grid;justify-items:center;gap:3px;border-radius:12px}
.tabs button:not(.s){color:var(--gold);background:rgba(255,201,60,.09)}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:620px){.tabs{left:50%;right:auto;width:600px;transform:translateX(-50%);border:1px solid var(--ln);border-bottom:0;border-radius:18px 18px 0 0}}
/* crests */
.cr{--h:120;display:inline-grid;place-items:center;flex:none;width:22px;height:26px;clip-path:polygon(50% 100%,4% 76%,0 8%,50% 0,100% 8%,96% 76%);background:linear-gradient(165deg,hsl(var(--h) 64% 50%),hsl(var(--h) 70% 24%));color:#fff;font:700 9.5px/1 var(--fn);letter-spacing:.02em;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.cr.lg{width:42px;height:48px;font-size:15px}
.tn{display:inline-flex;align-items:center;gap:8px;min-width:0}
/* rows & badges */
.p{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer}
.p:last-child{border-bottom:0}
.p.on{background:var(--hi);box-shadow:inset 3px 0 0 var(--turf)}
.p:active{background:var(--s2)}
.b{font:600 11.5px/1 var(--fn);letter-spacing:.05em;width:40px;text-align:center;border-radius:6px;padding:4px 0;background:var(--s3);color:var(--fg);flex:none}
.b[data-p=GK]{background:#e2a90b;color:#1d1500}.b[data-p=DEF]{background:#2f6fdc;color:#fff}.b[data-p=MID]{background:#1f9a59;color:#fff}.b[data-p=FWD]{background:#d8463f;color:#fff}
.ib{color:var(--gold);cursor:pointer;margin-left:4px}
/* match */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:10px 0 12px}
.vs>div{display:grid;justify-items:center;gap:6px;min-width:0}
.vs b{font:600 15px/1.2 var(--fb);overflow-wrap:anywhere}
.vs>span{font:800 12px var(--fd);color:var(--mu);letter-spacing:.08em}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin:6px 0}
.board>div{display:grid;justify-items:center;gap:6px;min-width:0;font-size:13.5px;font-weight:600}
.board span{overflow-wrap:anywhere}
.sc{font:700 60px/1 var(--fn);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em;color:var(--fg);transition:transform .2s,color .2s}
.sc i{font-style:normal;color:var(--mu);margin:0 6px}
.sc.pop{transform:scale(1.18);color:var(--gold)}
.board .sc{font-size:52px}
.min{font:600 15px var(--fn);color:var(--gold);text-align:center;letter-spacing:.06em}
.cap{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.gl{text-align:center;font:800 24px var(--fd);color:var(--gold);letter-spacing:-.01em;animation:pulse .6s ease-in-out infinite alternate}
.live #lv>div:not(.sc):not(.min):not(.gl){font-size:14px;padding:3px 0}
/* tables */
.w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 10.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:6px 5px;text-align:right}
td{padding:7px 5px;text-align:right;border-top:1px solid var(--ln);font-size:14px}
td:not(:nth-child(2)){font-family:var(--fn);font-size:15px}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me td{background:rgba(255,201,60,.11);font-weight:600}
tr.me td:nth-child(2){color:var(--gold)}
td:first-child{width:34px;text-align:center}
.z1{background:var(--blue)!important;color:#fff}.z2{background:var(--gold)!important;color:var(--on)}.z3{background:var(--red)!important;color:#fff}
/* segments, chips, small lists */
.seg{display:flex;gap:4px;padding:4px;background:var(--s2);border-radius:13px;margin-bottom:10px}
.seg button{flex:1;min-height:36px;font-size:13px;padding:8px 6px}
.seg button.s{border:0}
.seg.big button{min-height:44px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border-radius:999px;padding:8px 13px;min-height:36px;font-size:13.5px}
.sub{font:600 11px var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin:16px 0 6px}
.ln{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--ln);font-size:14px}
.ln .n{width:34px;color:var(--mu);font:500 13px var(--fn);flex:none}
.ln .f{flex:1;min-width:0}
.ln b{font:600 16px var(--fn);color:var(--gold)}
.orb{color:var(--orange)!important}
.kp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln);font-size:13.5px}
.kp i{color:var(--mu);font-style:normal}
.kp>span:last-child{justify-content:flex-end;text-align:right}
.kp.me{color:var(--gold);font-weight:600}
.champ{display:flex;align-items:center;gap:12px;padding:8px 0}
.champ b{font:700 18px var(--fd);color:var(--gold)}
.eh{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--ln);font-size:14px}
.eh-s{font:600 20px var(--fn);color:var(--mu)}
.eh-b{display:grid;gap:3px;min-width:0}
.tag{display:inline-block;font:600 10px var(--fb);letter-spacing:.06em;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.tag.cl{background:var(--blue);color:#fff}.tag.el{background:var(--orange);color:#1d1000}
/* start screen */
.hero-s{padding-block:22px 6px}
.eyebrow{font:600 11px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.lead{color:var(--mu);max-width:46ch;margin:0 0 14px}
.cta{width:100%;min-height:48px;font-size:15px;margin-top:6px}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.club{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--s1);color:var(--fg);border:1px solid var(--ln);border-radius:14px;padding:10px 14px 10px 10px;text-align:left;min-height:64px}
.club:hover{background:var(--s2);border-color:rgba(255,201,60,.4);filter:none}
.club-n{font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere;display:grid;gap:2px}
.club-n small{font-weight:400;color:var(--mu);font-size:12px}
.club-s{font:600 22px var(--fn);color:var(--gold);font-variant-numeric:tabular-nums}
/* overlays */
.md{position:fixed;inset:0;background:rgba(4,8,16,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:70;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.md .c{background:var(--s2);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ts{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:80;padding:10px 16px;border-radius:12px;background:var(--s2);color:var(--fg);border:1px solid rgba(255,201,60,.6);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:sd 2.2s both;white-space:nowrap;font-weight:600;font-size:14px}
.cf{position:fixed;top:-40px;z-index:90;pointer-events:none;animation:fall 2s ease-in forwards}
/* gala */
.gala{background:radial-gradient(70% 50% at 50% 30%,rgba(255,190,60,.18),transparent 70%),rgba(4,8,16,.94)}
.gw{width:100%;max-width:400px;text-align:center;display:grid;gap:10px}
.gt{font:800 28px/1.05 var(--fd);margin:0}
.gs{min-height:240px;display:grid;align-content:center}
.aw{display:grid;gap:6px;justify-items:center;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.aw-k{font:600 11.5px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.aw-n{font:700 26px/1.1 var(--fd);letter-spacing:-.01em;overflow-wrap:anywhere}
.aw-n.big{font-size:32px;color:var(--gold)}
.aw-m{color:var(--mu);font-size:14px}
.ball{width:118px;height:118px;border-radius:50%;margin:0 auto 8px;background:radial-gradient(circle at 34% 28%,#fffbe0 0,#ffe27a 18%,#f3b622 46%,#a86f00 78%,#5a3a00 100%);box-shadow:0 0 70px rgba(255,201,60,.5),inset -10px -14px 28px rgba(0,0,0,.35);animation:glow 2.4s ease-in-out infinite alternate}
.prize{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.prize span{background:var(--s2);border:1px solid var(--ln);border-radius:999px;padding:6px 12px;font-size:13.5px}
.prize b{font-family:var(--fn);color:var(--gold);font-size:15px}
.yours{color:var(--turf);font-weight:700;margin-top:4px}
.drum .dots{display:flex;gap:10px;justify-content:center;margin-top:14px}
.drum .dots i{width:12px;height:12px;border-radius:50%;background:var(--gold);animation:pulse .5s ease-in-out infinite alternate}
.drum .dots i:nth-child(2){animation-delay:.17s}.drum .dots i:nth-child(3){animation-delay:.34s}
.skip{background:none!important;border:0!important;color:var(--mu)!important;font-weight:500;min-height:32px}
/* draft */
.prog{height:6px;border-radius:4px;background:var(--s3);position:relative;overflow:hidden}
.prog i{position:absolute;inset:0}
.prog i::after{background:var(--gold)}
.dr-ask{font-size:16px;margin:14px 2px 8px}
.dr-ask b{font-family:var(--fd);font-weight:600}
.offers{display:grid;gap:10px}
.oc{display:grid;gap:12px;width:100%;text-align:left;background:linear-gradient(160deg,var(--s2),var(--s1));color:var(--fg);border:1px solid var(--ln);border-radius:16px;padding:14px;font-weight:400}
.oc:hover{filter:none;border-color:rgba(255,201,60,.55)}
.oc[data-t=g]{border-color:rgba(255,201,60,.55);background:linear-gradient(160deg,rgba(255,201,60,.16),var(--s1) 60%)}
.oc[data-t=s]{border-color:rgba(200,214,235,.35)}
.oc[data-t=b]{border-color:rgba(205,140,85,.4)}
.oc-top{display:flex;gap:14px;align-items:center}
.oc-r{display:grid;justify-items:center;gap:4px;font:700 40px/1 var(--fn);color:var(--gold);flex:none;min-width:52px}
.oc[data-t=s] .oc-r{color:#d6e0ef}.oc[data-t=b] .oc-r{color:#e0a06b}
.oc-id{min-width:0}
.oc-n{font:700 17px/1.2 var(--fd);overflow-wrap:anywhere}
.oc-st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px}
.oc-st div{display:grid;grid-template-columns:1fr auto;gap:2px 6px;font-size:11px;color:var(--mu);letter-spacing:.04em}
.oc-st b{font:600 15px var(--fn);color:var(--fg)}
.oc-st i{grid-column:1/-1;height:3px;border-radius:2px;background:var(--s3);position:relative;overflow:hidden}
.oc-st i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--turf)}
.oc-go{font-weight:600;color:var(--gold);font-size:13.5px}
.picked{display:flex;flex-wrap:wrap;gap:6px}
.pk{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--ln);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.pk .b{width:34px;border-radius:999px}
.pk b{font-family:var(--fn);color:var(--gold)}
/* motion */
@keyframes up{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
@keyframes sd{0%{transform:translate(-50%,-30px);opacity:0}15%,80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
@keyframes pulse{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
@keyframes glow{from{box-shadow:0 0 40px rgba(255,201,60,.35),inset -10px -14px 28px rgba(0,0,0,.35)}to{box-shadow:0 0 90px rgba(255,201,60,.65),inset -10px -14px 28px rgba(0,0,0,.35)}}
.an .c{animation:up .35s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


html.tg{--tgt:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));--tgb:calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px))}
html.tg:root{padding-top:max(env(safe-area-inset-top,0px),var(--tgt));padding-bottom:0}
html.tg{scroll-padding-top:var(--tgt)}
html.tg body::before{height:max(env(safe-area-inset-top,0px),var(--tgt))}
html.tg #app{padding-bottom:calc(96px + max(env(safe-area-inset-bottom,0px),var(--tgb)))}
html.tg .tabs{padding-bottom:calc(6px + max(env(safe-area-inset-bottom,0px),var(--tgb)))}
html.tg .md{padding-top:max(16px,var(--tgt));padding-bottom:max(16px,var(--tgb))}
html.tg .ts{top:calc(12px + max(env(safe-area-inset-top,0px),var(--tgt)))}

/* CyberFoot Match Engine 2D */
.cf-moment-card{max-height:calc(100dvh - 42px);overflow-y:auto;overscroll-behavior:contain}
.cf-moment-field .cf-field{margin:0 0 8px;aspect-ratio:1.9}
.cf-moment-field .cf-ctrl{display:none}
.cf-moment-field .cf-caption{min-height:0;padding:4px 0;font-size:12px}
@media(max-height:720px){.cf-moment-field .cf-field{max-height:165px}}

.cf-field{position:relative;aspect-ratio:1.72;background:repeating-linear-gradient(90deg,#17633c 0 12.5%,#1b7045 12.5% 25%);border:2px solid #69ad84;border-radius:12px;overflow:hidden;margin:12px 0 8px;box-shadow:inset 0 0 30px #0005}
.cf-field svg{display:block;width:100%;height:100%}.cf-field .pitch{fill:none;stroke:#ffffff99;stroke-width:1.3}
.cf-player{transition:cx .35s linear,cy .35s linear}.cf-ball{transition:cx .35s linear,cy .35s linear;filter:drop-shadow(0 1px 2px #000)}
.cf-caption{min-height:40px;padding:8px 3px;color:var(--gold);font-weight:600;font-size:13px}
.cf-ctrl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.cf-ctrl button{flex:1;font-size:12px;padding:8px 5px;min-height:37px}
.cf-field .cf-flash{font:800 24px var(--fd);fill:#ffc93c;paint-order:stroke;stroke:#082818;stroke-width:4}

/* TV 3.1: scoreboard drawn inside SVG so Telegram iOS always displays it */
.cf-field{position:relative}
.cf-broadcast-hud{font-family:Arial,system-ui,sans-serif}
.live #lv>.sc{font-size:36px;line-height:1.1;margin:3px 0}
.live #lv>.gl{font-size:17px;margin:3px 0}
#lv>.sc{font-size:36px;line-height:1.1;margin:3px 0}
#lv>.gl{font-size:17px;margin:3px 0}
/* Match Engine 3.0 — TV broadcast presentation */
.cf-field{aspect-ratio:1.66!important;border:3px solid #273b52!important;border-radius:15px!important;background:#123522!important;box-shadow:0 14px 32px #0008,inset 0 0 20px #0008!important;margin:10px 0 7px!important}
.cf-field::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,#06132180,transparent 24%,transparent 75%,#06132190)}
.cf-field svg{position:relative;z-index:0}
.cf-field .pitch{stroke:#e9fff5b0!important;stroke-width:1.3}
.cf-player{filter:drop-shadow(1px 2px 1px #001a10aa);transition:none}
.cf-ball{filter:drop-shadow(0 1px 3px #000);transition:none}

// Match director: one authoritative event clock, with a real-time goal sequence.
let CF_SCENE_HOLD=0,CF_SCENE_GOAL=null;
function cfDirectorReset(){CF_SCENE_HOLD=0;CF_SCENE_GOAL=null}
function cfDirectorWaiting(){return performance.now()<CF_SCENE_HOLD}
function cfDirectorAdvance(m,events,step){
 const next=events.filter(e=>e.m>m).sort((a,b)=>a.m-b.m)[0];
 const proposed=Math.min(90,m+step);
 return next&&next.m<=proposed?next.m:proposed;
}
function cfDirectorGoal(goal){
 if(CF_SCENE_GOAL===goal)return;
 CF_SCENE_GOAL=goal;
 CF_SCENE_HOLD=performance.now()+4350;
}
// TV 3.5: independent animation frames; the match clock remains controlled by the original game.
let CF_MOTION_RUNNING=false,CF_MOTION_LAST=0;
function cfStartMotion(){
 if(CF_MOTION_RUNNING)return;
 CF_MOTION_RUNNING=true;CF_MOTION_LAST=0;
 const frame=now=>{
  const roots=document.querySelectorAll('#cf-pieces');
  if(!roots.length){CF_MOTION_RUNNING=false;return}
  const dt=CF_MOTION_LAST?Math.min(50,now-CF_MOTION_LAST):16;
  CF_MOTION_LAST=now;
  const alpha=1-Math.exp(-dt/125);
  roots.forEach(root=>{
   const nodes=root._cfNodes,targets=root._cfTargets,pos=root._cfPositions;
   // Opening kickoff: position two players at centre and animate the first pass.
   if(root._cfOpeningKickoff){
    const opening=root._cfOpeningKickoff;
    if(now-opening.at<1550&&!root._cfGoalSequence){
     targets[9]=[200,122];
     targets[8]=[174,139];
    }else root._cfOpeningKickoff=null;
   }
   if(root._cfGoalSequence){
    const elapsed=now-root._cfGoalSequence.at;
    if(elapsed>=780&&!root._cfGoalSequence.scoreShown){
     root._cfGoalSequence.scoreShown=true;
     const goal=root._cfGoalSequence.event;
     if(goal){
      const ev=window.CF_MATCH&&window.CF_MATCH.ev||[];
      const counted=ev.filter(e=>e.m<=goal.m);
      const h=counted.filter(e=>e.t==='h').length;
      document.querySelectorAll('#cf-tv-score').forEach(n=>n.textContent=h+' : '+(counted.length-h));
      document.querySelectorAll('#cf-flash').forEach(n=>n.textContent='ГОООЛ!');
     }
    }
    if(elapsed>=1350&&elapsed<3400){
     // After the goal, players return to their halves for the restart.
     for(let p=0;p<22;p++){
      const home=p<11,idx=p%11,side=home?-1:1;
      const col=idx===0?0:idx<5?1:idx<8?2:3;
      const lane=idx===0?0:(idx%4)-1.5;
      const x=210+side*(160-col*39);
      targets[p]=[Math.max(20,Math.min(400,x)),Math.max(20,Math.min(224,122+lane*38))];
     }
     targets[root._cfGoalSequence.kickOwner]=[root._cfGoalSequence.kickHome?201:219,122];
    }
   }
   if(!nodes||!targets||!pos)return;
   // Continuous off-ball movement and regular passes, even between highlights.
   // Driven by real time, not by jumps of the match-minute clock.
   if(!root._cfGoalSequence){
    if(!root._cfMotionEpoch)root._cfMotionEpoch=now;
    const seconds=(now-root._cfMotionEpoch)/1000;
    for(let p=0;p<22;p++){
     const base=(root._cfBaseTargets||targets)[p];if(!base)continue;
     const isKeeper=p===0||p===11;
     const run=isKeeper?2.5:9.5;
     const rx=Math.sin(seconds*(isKeeper?.48:.94)+(p*1.73))*run;
     const ry=Math.cos(seconds*(isKeeper?.55:1.12)+(p*2.13))*run*.76;
     // Dynamic pressing and supporting runs while retaining team shape.
     const support=!isKeeper&&p===root._cfOwner?5:0;
     targets[p]=[Math.max(17,Math.min(403,base[0]+rx+support*(p<11?1:-1))),Math.max(17,Math.min(227,base[1]+ry))];
    }
    const opening=!!root._cfOpeningKickoff;
    if(!opening&&!root._cfPass&&!root._cfShot){
     if(!root._cfLastPass)root._cfLastPass=now;
     if(now-root._cfLastPass>1650){
      const old=root._cfOwner===undefined?8:root._cfOwner;
      const teamStart=old<11?0:11;
      const candidates=[5,6,7,8,9,10].map(v=>teamStart+v).filter(v=>v!==old);
      // Prefer a nearby teammate, so passes look like realistic combinations.
      candidates.sort((a,b)=>Math.hypot(pos[a][0]-pos[old][0],pos[a][1]-pos[old][1])-Math.hypot(pos[b][0]-pos[old][0],pos[b][1]-pos[old][1]));
      const receiver=candidates[Math.floor(seconds/1.65)%Math.min(3,candidates.length)];
      root._cfPass={from:root._cfPositions[23].slice(),owner:receiver,at:now,duration:630};
      root._cfLastPass=now;
     }
    }
   }
   for(let i=0;i<nodes.length;i++){
    let target=targets[i];if(!target)continue;
    if(i>=22){
     // Ball follows the receiver only after a pass has actually reached them.
     const owner=root._cfOwner,carrier=pos[owner]||targets[owner];
     const foot=[carrier[0]+(owner<11?8:-8),carrier[1]+5];
     const seq=root._cfGoalSequence;
     if(seq){
      const elapsed=now-seq.at;
      if(elapsed<760){
       const t=Math.min(1,elapsed/760),ease=t*t*(3-2*t);
       // The ball crosses the actual goal line, inside the posts.
       target=[seq.from[0]+(seq.goalX-seq.from[0])*ease,seq.from[1]+(122-seq.from[1])*ease];
      }else if(elapsed<1350){target=[seq.goalX,122]}
      else if(elapsed<2150){
       const t=Math.min(1,(elapsed-1350)/800),ease=t*t*(3-2*t);
       target=[seq.goalX+(210-seq.goalX)*ease,122];
      }else if(elapsed<3400){target=[210,122]}
      else{
       root._cfGoalSequence=null;root._cfOwner=seq.kickOwner;root._cfPass=null;
       // A real kickoff: the conceding side taps the ball from the centre to a teammate.
       const receiver=seq.kickHome?8:19;
       root._cfPass={from:[210,122],owner:receiver,at:now,duration:800};
       target=[210,122];
      }
      if(root._cfGoalSequence){
       pos[i][0]=target[0];pos[i][1]=target[1];
       nodes[i].setAttribute('cx',pos[i][0].toFixed(2));
       nodes[i].setAttribute('cy',pos[i][1].toFixed(2));
       continue;
      }
     }
     const shot=root._cfShot,pass=root._cfPass;
     if(shot){
      const t=Math.min(1,(now-shot.at)/650),ease=t*t*(3-2*t);
      target=[shot.from[0]+(shot.to[0]-shot.from[0])*ease,shot.from[1]+(shot.to[1]-shot.from[1])*ease];
      if(t>=1)root._cfShot=null;
     }else if(pass){
      const receiver=pos[pass.owner]||targets[pass.owner];
      const end=[receiver[0]+(pass.owner<11?8:-8),receiver[1]+5];
      const t=Math.max(0,Math.min(1,(now-pass.at)/(pass.duration||480))),ease=t*t*(3-2*t);
      target=[pass.from[0]+(end[0]-pass.from[0])*ease,pass.from[1]+(end[1]-pass.from[1])*ease-15*Math.sin(Math.PI*t)];
      if(t>=1){root._cfPass=null;root._cfOwner=pass.owner;root._cfLastPass=now;}
     }else target=foot;
     pos[i][0]=target[0];pos[i][1]=target[1];
    }else{
     pos[i][0]+=(target[0]-pos[i][0])*alpha;
     pos[i][1]+=(target[1]-pos[i][1])*alpha;
    }
    nodes[i].setAttribute('cx',pos[i][0].toFixed(2));
    nodes[i].setAttribute('cy',pos[i][1].toFixed(2));
   }
  });
  requestAnimationFrame(frame);
 };
 requestAnimationFrame(frame);
}
// TV 3.6: possession, dribbling, passes and shots are visual-only. Match outcomes are unchanged.
function cfPaint(min,events,home,away){
 const roots=document.querySelectorAll('#cf-pieces');if(!roots.length)return;
 const set=(id,value)=>document.querySelectorAll('#'+id).forEach(el=>el.textContent=value);
 const past=events.filter(e=>e.m<=min&&!(e===CF_SCENE_GOAL&&cfDirectorWaiting()&&performance.now()<CF_SCENE_HOLD-3300)),hg=past.filter(e=>e.t==='h').length;
 const abbr=n=>String(n||'').trim().split(/\s+/).map(x=>x.slice(0,5)).join(' ').slice(0,13).toUpperCase()||'КЛУБ';
 set('cf-tv-home',abbr(home));set('cf-tv-away',abbr(away));
 set('cf-tv-score',hg+' : '+(past.length-hg));set('cf-tv-clock',String(Math.floor(min)).padStart(2,'0')+':00');
 const goal=events.find(e=>e.m===min);
 const upcoming=events.find(e=>e.m>min&&e.m-min<=3);
 const attack=(goal||upcoming)?(goal||upcoming).t:(Math.floor(min/9)%2?'h':'a');
 const isHome=attack==='h',dir=isHome?1:-1,team=isHome?0:1;
 const phase=min%9,carrier=[5,6,7,8,9,10][Math.floor(min/5)%6];
 const positions=[];
 for(let t=0;t<2;t++)for(let i=0;i<11;i++){
  const forward=t===0?1:-1,col=i===0?0:i<5?1:i<8?2:3,lane=i===0?0:(i%4)-1.5;
  let x=210+forward*(-160+col*85)+Math.sin(min*.22+i*2.4)*9;
  let y=122+lane*43+Math.cos(min*.17+i*1.7)*7;
  // The player follows formation and makes a small run; no teleporting toward the ball.
  if(t===team&&i===carrier){x+=dir*11;y+=Math.sin(min*.31)*5}
  if((goal||upcoming)&&t===team&&i===9){x+=dir*18;y+=(122-y)*.22}
  positions.push([Math.max(18,Math.min(402,x)),Math.max(18,Math.min(226,y))]);
 }
 const owner=team*11+((goal||upcoming)?9:carrier);
 roots.forEach(root=>{
  if(!root.dataset.cfReady){
   const pieces=[];
   for(let i=0;i<22;i++)pieces.push(`<circle class="cf-player" cx="210" cy="122" r="6.3" fill="${i<11?'#f2f4ff':'#e94d55'}" stroke="${i<11?'#4b5979':'#75262d'}" stroke-width="1.5"/>`);
   pieces.push('<circle class="cf-halo" cx="210" cy="122" r="11" fill="none" stroke="#ffe071" stroke-width="1.6" stroke-opacity=".8" stroke-dasharray="3 3"/>');
   pieces.push('<circle class="cf-ball" cx="210" cy="122" r="4.2" fill="#fff" stroke="#152318" stroke-width="1.2"/>');
   root.innerHTML=pieces.join('');root.dataset.cfReady='1';root._cfNodes=Array.from(root.querySelectorAll('circle'));
   root._cfPositions=positions.concat([[210,122],[210,122]]).map(p=>p.slice());
   // Start the broadcast with a real kickoff instead of a stationary ball.
   const startAt=performance.now();
   root._cfOpeningKickoff={at:startAt};
   root._cfOwner=9;
   root._cfPass={from:[210,122],owner:8,at:startAt+650,duration:850};
   root._cfPositions[9]=[200,122];
   root._cfPositions[8]=[174,139];
  }
  if(!root._cfGoalSequence){root._cfTargets=positions.concat([positions[owner],positions[owner]]);root._cfBaseTargets=positions.map(p=>p.slice())}
  // Never restart a pass before the ball reaches its intended receiver.
  // The game clock can tick several times during one 480 ms pass.
  if(root._cfOwner===undefined){root._cfOwner=owner;}
  else if(!root._cfGoalSequence&&!root._cfPass&&!root._cfShot&&root._cfOwner!==owner&&
          (goal||upcoming||Math.floor(min/9)%2!==(root._cfOwner<11?1:0))){
   // Switch possession on a meaningful attacking change, not every timer tick.
   root._cfPass={from:root._cfPositions[23].slice(),owner,at:performance.now(),duration:720};
  }
  if(goal&&!root._cfGoalSequence&&root._cfGoalEvent!==goal){
   cfDirectorGoal(goal);
   root._cfGoalEvent=goal;
   root._cfPass=null;
   root._cfOwner=owner;
   root._cfShot=null;
   const kickHome=!isHome;
   root._cfGoalSequence={from:root._cfPositions[23].slice(),goalX:dir>0?418:2,at:performance.now(),kickOwner:kickHome?9:20,kickHome,event:goal};
  }
 });
 cfStartMotion();
 const captions=document.querySelectorAll('#cf-caption'),flashes=document.querySelectorAll('#cf-flash');
 if(goal){captions.forEach(c=>c.textContent=`🥅 ${min}’ ${goal.who||'Игрок'} — УДАР ПО ВОРОТАМ! (${goal.t==='h'?home:away})`);flashes.forEach(f=>f.textContent='')}
 else if(upcoming){captions.forEach(c=>c.textContent=`🔥 ${min}’ ${isHome?home:away}: выход на ударную позицию!`);flashes.forEach(f=>f.textContent='')}
 else{captions.forEach(c=>c.textContent=`${min}’ · ${isHome?home:away}: ${phase%6===0?'передача партнёру':'ведение мяча'}`);flashes.forEach(f=>f.textContent='')}
}
// A knockout tie already has a penalty winner in the existing cup simulation.
// This animation presents that decision without rerolling or altering the saved result.
function cfPenaltyShow(rep,done){
 // Penalty shootout is a presentation of the existing knockout winner, not a second simulation.
 const winner=rep.pn,home=rep.h,away=rep.a;
 const host=document.createElement('div');host.className='md';host.style.zIndex='95';
 host.innerHTML=`<div class="c" style="width:min(450px,96vw);text-align:center;background:#142338;border:1px solid #ffc93c77">
 <div class="eyebrow">🏆 ПЛЕЙ-ОФФ · СЕРИЯ ПЕНАЛЬТИ</div><h2 style="margin:10px 0;font-size:18px">${home} — ${away}</h2>
 <svg id="cf-pen-pitch" viewBox="0 0 360 175" style="display:block;width:100%;background:#236b42;border-radius:12px;border:2px solid #8cbd93" aria-label="Пенальти с одиннадцатиметровой отметки">
 <defs><pattern id="cf-pen-grass" width="40" height="175" patternUnits="userSpaceOnUse"><rect width="40" height="175" fill="#246e43"/><rect width="20" height="175" fill="#2b794a"/></pattern></defs>
 <rect width="360" height="175" fill="url(#cf-pen-grass)"/>
 <g stroke="#ffffffa9" fill="none" stroke-width="1.6"><path d="M282 12V163H359M282 37H359M282 138H359"/><path d="M315 58H359M315 117H359"/><path d="M346 65V110H358V65Z" stroke-width="2.8"/><path d="M346 65H358V110H346" stroke-dasharray="3 4" stroke-width=".8"/></g>
 <circle cx="245" cy="87" r="2.5" fill="#fff"/><text x="245" y="110" fill="#ffffffa8" font-size="9" text-anchor="middle">11 м</text>
 <circle id="cf-pen-shooter" cx="208" cy="87" r="9" fill="#f3f5ff" stroke="#243657" stroke-width="2"/>
 <circle id="cf-pen-keeper" cx="348" cy="87" r="10" fill="#ffc93c" stroke="#7e4f18" stroke-width="2"/>
 <circle id="cf-pen-ball" cx="245" cy="87" r="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
 </svg>
 <div id="cf-pen-text" style="font-weight:700;color:white;margin-top:10px">Игроки готовятся к серии...</div>
 <div id="cf-pen-score" style="font:700 32px var(--fn);color:var(--gold)">0 : 0</div>
 <p class="mu" id="cf-pen-step">Удары с 11 метров · анимация серии</p>
 <button id="cf-pen-skip" class="cta">⏭ Пропустить серию</button></div>`;
 document.body.appendChild(host);
 const ball=host.querySelector('#cf-pen-ball'),keeper=host.querySelector('#cf-pen-keeper'),shooter=host.querySelector('#cf-pen-shooter');
 const label=host.querySelector('#cf-pen-text'),score=host.querySelector('#cf-pen-score'),step=host.querySelector('#cf-pen-step'),btn=host.querySelector('#cf-pen-skip');
 // A representative 5-4 sequence. The winner is taken exclusively from rep.pn.
 const homeWins=winner===home;
 const results=homeWins?[true,true,true,true,true,true,true,true,true,false]:[true,true,true,true,true,true,true,true,false,true];
 let index=0,h=0,a=0,active=true,frameId=0,timeoutId=0,ended=false;
 const cancel=()=>{cancelAnimationFrame(frameId);clearTimeout(timeoutId)};
 const finish=()=>{if(ended)return;ended=true;active=false;cancel();host.remove();done()};
 btn.onclick=()=>{if(index>=results.length){finish();return}finish()};
 function animateShot(success,side,onEnd){
  const begin=performance.now(),duration=760,goalY=success?(side==='h'?73:101):87;
  shooter.setAttribute('fill',side==='h'?'#f3f5ff':'#ef5960');
  const draw=now=>{
   if(!active)return;
   const t=Math.min(1,(now-begin)/duration),flight=Math.max(0,(t-.22)/.78),e=flight*flight*(3-2*flight);
   const kick=Math.min(1,t/.22);
   shooter.setAttribute('cx',(208+26*kick).toFixed(1));
   ball.setAttribute('cx',(245+(success?107:88)*e).toFixed(1));
   ball.setAttribute('cy',(87+(goalY-87)*e-8*Math.sin(Math.PI*e)).toFixed(1));
   keeper.setAttribute('cy',(87+(success?(side==='h'?22:-22):0)*Math.min(1,t*2)).toFixed(1));
   if(t<1)frameId=requestAnimationFrame(draw);else onEnd();
  };
  frameId=requestAnimationFrame(draw);
 }
 function next(){
  if(!active)return;
  if(index>=results.length){label.textContent='🏆 Победитель серии: '+winner;step.textContent='Итог серии: '+h+' : '+a+' · демонстрационная последовательность';btn.textContent='Продолжить';return}
  const side=index%2===0?'h':'a',success=results[index],who=side==='h'?home:away;
  ball.setAttribute('cx','245');ball.setAttribute('cy','87');keeper.setAttribute('cy','87');shooter.setAttribute('cx','208');
  label.textContent='⚽ '+who+' — разбег и удар!';step.textContent='Удар '+(index+1)+' из '+results.length+' · 11-метровая отметка';
  animateShot(success,side,()=>{
   if(success){if(side==='h')h++;else a++}
   score.textContent=h+' : '+a;
   label.textContent=success?'⚽ ГОЛ! Мяч в воротах!':'❌ Пенальти не реализован!';
   index++;timeoutId=setTimeout(next,650);
  });
 }
 timeoutId=setTimeout(next,500);
}
